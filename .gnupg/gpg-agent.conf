# default-cache-ttl is sliding (reset on every use), max-cache-ttl is the
# absolute cap from first caching. 8h/12h means one passphrase entry in a real
# terminal covers a working day of agent-driven signed commits; during that
# window any local process running as this user can sign, which is the inherent
# trade-off of a warm gpg-agent cache.
default-cache-ttl 28800
max-cache-ttl 43200
pinentry-program ~/.gnupg/pinentry-auto

